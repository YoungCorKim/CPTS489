<!-- The Basic GUI Design For Our Website -->

<!DOCTYPE html>
<html lang="eng">
    <head>
        <link rel="stylesheet" href="Website.css">
    </head>

    <body>
        <div id="mainLayout">
            <!-- This is the Side Navbar -->
            <div id="sidebar">
                <div id="navSpace">
                    <!-- Replace This With an Icon Eventually... ? -->
                </div>
                <button class="sideButton" onclick="homeOpen()">
                    Home
                </button>
                <button class="sideButton" onclick="loginOpen()">
                    Login
                </button>
                <button class="sideButton" onclick="profileOpen()">
                    Profile
                </button>
                <button class="sideButton" onclick="calendarsOpen()">
                    Calendars
                </button>
                <!-- These Will Need to Be Professor Only Eventually -->
                <button class="sideButton" onclick="createClassOpen()">
                    Create Class
                </button>
                <button class="sideButton" onclick="manageClassOpen()">
                    Manage Classes
                </button>
                <!-- These Will Only Be A Student View Eventually -->
                <button class="sideButton" onclick="createEventOpen()">
                    Create Event
                </button>
                <button class="sideButton" onclick="importSchedOpen()">
                    Import Schedule
                </button>
                <button class="sideButton" onclick="groupOpen()">
                    Groups
                </button>

                <!-- Utilities For Everyone -->
                <button class="sideButton" onclick="findOpen()">
                    Find User
                </button>
                <button class="sideButton" onclick="settingsOpen()">
                    Settings
                </button>
            </div>
            <!-- Each Of These is a Tab and Is Set to None Display So It Is Hidden -->

            <!-- Main Tabs -->
            <div class="tab left" id="home">
                Main Text :D
            </div>
            <div class="tab center" id="profile" style="display: none;">
                Profile Info
            </div>
            <div class="tab center" id="login" style="display: none;">
                Login Page
                <p boldfont>
                    Enter Your Username or Email
                </p>
                <input type="text" class="textBar loginBar" id="username">
                <!-- We Will Have To Make This Hidden (With Events) -->
                <p boldfont>
                    Enter Your Password
                </p>
                <!-- Type Password Makes It * -->
                <input type="password" class="textBar loginBar" id="password">
                <!-- Show/Hide Password Toggle -->
                <input type="checkbox" id="passwordToggle" onchange="passwordToggle()">
                <label for="passwordToggle">Show Password</label>
                <!-- Login Error Text -->
                <div id="loginErrorText" style="display: none;"></div>
                <button id="loginButton" onclick="loginCheck()">
                    Login
                </button>
            </div>
            <div class="tab center" id="calendars" style="display: none;">
                Calendar View
            </div>

            <!-- Professor Tabs -->
            <div class="tab center" id="createClass" style="display: none;">
                Create Class Prof
            </div>
            <div class="tab left" id="manageClass" style="display: none;">
                Manage Classes
            </div>

            <!-- Student Tabs -->
            <div class="tab center" id="createEvent" style="display: none;">
                Create Event
            </div>
            <div class="tab center" id="importSched" style="display: none;">
                Import a Calendar
            </div>
            <div class="tab left" id="groups" style="display: none;">
                View Groups
            </div>

            <!-- Utilities -->
            <div class="tab center" id="findUser" style="display: none;">
                <p boldfont>
                    Search For a User Below
                </p boldfont>
                <input type="text" class="textBar searchBar" id="userSearchBar" placeholder="Enter a Username">
            </div>
            <div class="tab left" id="settings" style="display: none;">
                Settings!!
            </div>
        </div>

        <!-- Link to JavaScript Code -->
         <script src="Website.js"></script>
    </body>
</html>
